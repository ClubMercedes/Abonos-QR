<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>QR Entradas — Escáner</title>
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d11;--surf:#17171e;--surf2:#1f1f28;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--gold:#f5c842;--ok:#22c55e;--err:#ef4444;--text:#ede9e0;--muted:#888;--r:12px;--r2:8px}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;max-width:480px;margin:0 auto}
#app{padding:1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.logo{font-size:16px;font-weight:700;color:var(--gold)}
.logo span{color:var(--text);font-weight:400;font-size:13px}
.conn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%}
.result{border-radius:var(--r);padding:1.25rem;margin-bottom:1rem;text-align:center;transition:all .25s}
.result.idle{background:var(--surf);border:1px solid var(--border)}
.result.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35)}
.result.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35)}
.result .icon{font-size:40px;margin-bottom:6px;line-height:1}
.result .title{font-size:20px;font-weight:700;margin-bottom:4px}
.result .sub{font-size:13px;opacity:.75}
.result .detail{font-size:12px;margin-top:8px;opacity:.6}
.cam-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:1rem;aspect-ratio:4/3}
#video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame::before{content:'';width:200px;height:200px;border:2px solid var(--gold);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan-line{position:absolute;width:196px;height:2px;background:var(--gold);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%{top:calc(50% - 98px)}100%{top:calc(50% + 96px)}}
.cam-off{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:2rem;text-align:center;margin-bottom:1rem}
.cam-off p{color:var(--muted);font-size:13px;margin-bottom:1rem}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.8px}
.manual-row{display:flex;gap:8px}
.manual-row input{flex:1;background:var(--surf2);border:1px solid var(--border2);border-radius:var(--r2);padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.manual-row input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:var(--r2);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surf2);color:var(--text);transition:all .15s;font-family:inherit;width:100%}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.err{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{padding:6px 14px;font-size:12px;width:auto}
.btn:hover{opacity:.9}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.ms{background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:.75rem;text-align:center}
.ms-v{font-size:22px;font-weight:700}
.ms-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.log-list{list-style:none;max-height:250px;overflow-y:auto}
.log-list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:center;gap:6px}
.log-list li:last-child{border-bottom:none}
.hidden{display:none!important}
.mt{margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">QR<span> Escáner</span></div>
    <div class="conn">
      <div class="dot" id="dot" style="background:var(--muted)"></div>
      <span id="conn-lbl">Conectando...</span>
    </div>
  </div>

  <div id="result" class="result idle">
    <div class="icon">📷</div>
    <div class="title">Listo para escanear</div>
    <div class="sub">Activá la cámara o usá el lector QR</div>
  </div>

  <div id="cam-on" class="cam-wrap hidden">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-frame"><div class="scan-line"></div></div>
  </div>
  <div id="cam-off" class="cam-off">
    <p>Cámara desactivada</p>
    <button class="btn gold" onclick="startCam()">📷 Activar cámara</button>
  </div>
  <button id="btn-stop" class="btn err hidden mt" onclick="stopCam()" style="margin-bottom:1rem">⏹ Detener cámara</button>

  <div class="card">
    <div class="card-title">Lector QR / código manual</div>
    <div class="manual-row">
      <input type="text" id="manual" placeholder="El lector escribe aquí..." onkeydown="if(event.key==='Enter')validateManual()" autofocus/>
      <button class="btn gold" style="width:auto;padding:9px 14px" onclick="validateManual()">✓</button>
    </div>
  </div>

  <div class="mini-stats">
    <div class="ms"><div class="ms-v" id="ms-total">0</div><div class="ms-l">Total</div></div>
    <div class="ms"><div class="ms-v" id="ms-used" style="color:var(--ok)">0</div><div class="ms-l">Ingresaron</div></div>
    <div class="ms"><div class="ms-v" id="ms-pend">0</div><div class="ms-l">Pendientes</div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
      <div class="card-title" style="margin:0">Últimos ingresos</div>
      <button class="btn sm" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <ul class="log-list" id="log-list"><li style="color:var(--muted)">Sin registros aún</li></ul>
  </div>
</div>

<script type="module">
// ======= FIREBASE CONFIG — hardcoded =======
const FIREBASE_CFG = {
  apiKey: "AIzaSyCeZ3JFvOeTaeemI9uQN4kbiUQUjasoOTc",
  databaseURL: "https://abonos-1c-default-rtdb.firebaseio.com",
  projectId: "abonos-1c",
  appId: "1:804032624085:web:e682467181479d1c6ef95c"
};

let db = null, _fbRef = null, _fbUpdate = null;
let entries = [];
let currentPartido = null;
let scanLog = JSON.parse(localStorage.getItem('scanLog')||'[]');
let stream = null, scanInterval = null;
let lastScan = '', lastScanTime = 0;
let scanCooldownUntil = 0; // mientras Date.now() sea menor a esto, se ignoran lecturas nuevas
const SCAN_COOLDOWN_MS = 3000; // pausa (ms) después de cada lectura antes de aceptar otra

window.startCam = startCam;
window.stopCam = stopCam;
window.validateManual = validateManual;
window.exportCSV = exportCSV;

async function initFB(){
  try{
    const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const {getDatabase, ref, onValue, update} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const app = initializeApp(FIREBASE_CFG, 'scanner');
    db = getDatabase(app);
    _fbRef = ref;
    _fbUpdate = update;
    // listen for entries in real time
    onValue(ref(db,'entries'), snap=>{
      const data = snap.val();
      if(data && Array.isArray(data)){
        // merge with local used state from scanLog
        const usedIds = new Set(scanLog.filter(l=>l.valido).map(l=>l.id));
        entries = data.map(e=>({...e, used: e.used || usedIds.has(e.id)}));
        updateStats();
      }
    });
    onValue(ref(db,'currentPartido'), snap=>{
      currentPartido = snap.val() || null;
    });
    onValue(ref(db,'log'), snap=>{
      const data = snap.val();
      if(data){
        const arr = Array.isArray(data) ? data : Object.values(data);
        scanLog = arr;
        localStorage.setItem('scanLog', JSON.stringify(scanLog));
        renderLog();
        updateStats();
      }
    });
    // listen for reset signal from admin
    onValue(ref(db,'resetAt'), snap=>{
      const resetAt = snap.val();
      if(!resetAt) return;
      const lastReset = localStorage.getItem('lastResetAt');
      if(resetAt !== lastReset){
        // admin finalized event — clear all local data
        localStorage.setItem('lastResetAt', resetAt);
        scanLog = [];
        localStorage.removeItem('scanLog');
        entries = [];
        renderLog();
        updateStats();
        showResult('idle','Listo para escanear','Evento reiniciado. Esperando nuevas entradas...');
      }
    });
    document.getElementById('dot').style.background = 'var(--ok)';
    document.getElementById('conn-lbl').textContent = 'Firebase conectado';
  }catch(e){
    document.getElementById('dot').style.background = 'var(--err)';
    document.getElementById('conn-lbl').textContent = 'Error conexion';
    console.error('Firebase error:', e);
  }
}

// ======= VALIDATE =======
async function validateCode(raw){
  scanCooldownUntil = Date.now() + SCAN_COOLDOWN_MS;
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){
    logScan({id:'?', nombre:'QR invalido', abono:'', partido:'', valido:false, motivo:'QR no reconocido'});
    showResult('err','❌ QR inválido','No corresponde a una entrada');
    return;
  }

  const norm = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,' ');
  if(currentPartido && norm(data.partido) !== norm(currentPartido)){
    logScan({id:data.id||'?', nombre:data.nombre||'Desconocido', abono:data.abono||'', partido:data.partido||'', valido:false, motivo:'QR de otro evento'});
    showResult('err','❌ QR de otro evento', 'Este QR es de "'+(data.partido||'?')+'"', 'Evento activo: "'+currentPartido+'"');
    return;
  }

  if(!entries.length){
    showResult('err','❌ Sin datos','Esperá que carguen las entradas de Firebase');
    return;
  }

  const idx = entries.findIndex(e => e.id === data.id);
  if(idx === -1){
    logScan({id:data.id||'?', nombre:data.nombre||'Desconocido', abono:data.abono||'', partido:data.partido||'', valido:false, motivo:'ID no registrado'});
    showResult('err','❌ No encontrada','Esta entrada no está registrada');
    return;
  }

  const entry = entries[idx];
  if(entry.used){
    logScan({id:entry.id, nombre:entry.nombre, abono:entry.abono||'', partido:entry.partido||'', valido:false, motivo:'Ya habia ingresado'});
    showResult('err','🚫 Ya usada', entry.nombre + ' · Ya ingresó', entry.partido||'');
    return;
  }

  // Mark as used
  entries[idx].used = true;
  const logEntry = {id:entry.id, nombre:entry.nombre, abono:entry.abono||'', partido:entry.partido||'', valido:true, motivo:'', at:new Date().toISOString()};
  scanLog.push(logEntry);
  localStorage.setItem('scanLog', JSON.stringify(scanLog));
  renderLog();

  // Update Firebase: "usado" + historial en UNA sola escritura atómica,
  // para que nunca quede marcado como usado sin su registro en el historial.
  if(db && _fbRef && _fbUpdate){
    const doWrite = () => _fbUpdate(_fbRef(db), {
      ['entries/'+idx+'/used']: true,
      ['log']: [...scanLog]
    });
    try{
      await doWrite();
    }catch(e){
      console.warn('sync err, reintentando...', e);
      try{ await doWrite(); }catch(e2){ console.warn('sync err (2do intento)', e2); }
    }
  }

  showResult('ok','✅ Ingreso válido', entry.nombre, entry.partido||(entry.abono?'Abono: '+entry.abono:''));
  updateStats();
  renderLog();
}

async function logScan(entry){
  const log = {...entry, at: new Date().toISOString()};
  scanLog.push(log);
  localStorage.setItem('scanLog', JSON.stringify(scanLog));
  renderLog();
  // sync all logs to Firebase
  if(db && _fbRef && _fbUpdate){
    try{
      await _fbUpdate(_fbRef(db), {log: [...scanLog]});
    }catch(e){ console.warn('log sync err', e); }
  }
}

let audioCtx = null;
function playBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [523,659,784].forEach(freq=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t+0.3);
    });
  }catch(e){ console.error('Beep error', e); }
}

function playReject(){
  if(navigator.vibrate){
    navigator.vibrate([180,90,180]);
    return;
  }
  // iPhone/Safari no soporta vibración: sonido de respaldo
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.linearRampToValueAtTime(180, t+0.35);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.37);
  }catch(e){ console.error('Reject sound error', e); }
}

function showResult(type, title, sub, detail=''){
  const el = document.getElementById('result');
  el.className = 'result ' + type;
  el.innerHTML = `<div class="icon">${{ok:'✅',err:'❌',idle:'📷'}[type]||'📷'}</div><div class="title">${title}</div><div class="sub">${sub}</div>${detail?`<div class="detail">${detail}</div>`:''}`;
  if(type==='ok') playBeep();
  else if(type==='err') playReject();
  // El mensaje ya no se borra solo: queda visible hasta la próxima lectura.
}

function validateManual(){
  const val = document.getElementById('manual').value.trim();
  if(!val) return;
  if(Date.now() < scanCooldownUntil) return; // en pausa: ignora envíos repetidos
  validateCode(val);
  document.getElementById('manual').value = '';
  document.getElementById('manual').focus();
}

// ======= CAMERA =======
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    document.getElementById('video').srcObject = stream;
    document.getElementById('cam-off').classList.add('hidden');
    document.getElementById('cam-on').classList.remove('hidden');
    document.getElementById('btn-stop').classList.remove('hidden');
    scanInterval = setInterval(()=>scanFrame(document.getElementById('video')), 250);
  }catch(e){ alert('No se pudo acceder a la cámara:\n'+e.message); }
}

function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(scanInterval){ clearInterval(scanInterval); scanInterval=null; }
  document.getElementById('cam-on').classList.add('hidden');
  document.getElementById('cam-off').classList.remove('hidden');
  document.getElementById('btn-stop').classList.add('hidden');
}

function scanFrame(video){
  if(video.readyState !== video.HAVE_ENOUGH_DATA) return;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  const img = c.getContext('2d').getImageData(0, 0, c.width, c.height);
  const code = jsQR(img.data, img.width, img.height);
  if(code){
    // Solo procesa si es un código distinto al que ya estaba en cuadro
    // (evita releer el mismo QR mientras sigue frente a la cámara).
    if(code.data !== lastScan){
      lastScan = code.data; lastScanTime = Date.now();
      validateCode(code.data);
    }
  } else {
    lastScan = ''; // el QR salió de cuadro: habilitado para leer de nuevo
  }
}

// ======= STATS & LOG =======
function updateStats(){
  const used = entries.filter(e=>e.used).length;
  document.getElementById('ms-total').textContent = entries.length;
  document.getElementById('ms-used').textContent = used;
  document.getElementById('ms-pend').textContent = entries.length - used;
}

function renderLog(){
  const el = document.getElementById('log-list');
  if(!scanLog.length){ el.innerHTML='<li style="color:var(--muted)">Sin registros aún</li>'; return; }
  el.innerHTML = [...scanLog].reverse().slice(0,30).map(l=>`
    <li>
      <span style="font-size:16px">${l.valido?'✅':'❌'}</span>
      <span style="flex:1"><strong>${l.nombre}</strong> · ${l.abono||'-'} ${l.motivo?'<span style="color:var(--muted);font-size:11px">· '+l.motivo+'</span>':''}</span>
      <span style="color:var(--muted);white-space:nowrap;font-size:11px">${new Date(l.at).toLocaleTimeString()}</span>
    </li>
  `).join('');
}

function exportCSV(){
  if(!scanLog.length){ alert('Sin registros'); return; }
  const rows = [['Estado','Nombre','Abono','Partido','Hora','Motivo']].concat(
    scanLog.map(l=>[
      l.valido?'Valido':'Rechazado',
      l.nombre, l.abono||'', l.partido||'',
      new Date(l.at).toLocaleString(),
      l.motivo||''
    ])
  );
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));
  a.download = 'registro_ingresos.csv';
  a.click();
}

// ======= INIT =======
window.addEventListener('load', ()=>{
  initFB();
  renderLog();
});
</script>
</body>
</html>
